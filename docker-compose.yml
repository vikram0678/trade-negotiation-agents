
services:
  ollama:
    image: ollama/ollama:latest
    container_name: negotiation-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    container_name: negotiation-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull $${OLLAMA_MODEL:-llama3:latest}"
    env_file:
      - .env
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: negotiation-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: negotiation-tests
    env_file:
      - .env
    environment:
      RUN_REAL_LLM_TESTS: "1"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    command: ["python", "-m", "pytest", "-v", "-s"]
    profiles:
      - testing

volumes:
  ollama_data:
